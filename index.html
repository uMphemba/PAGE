<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindful Hero</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            overflow: hidden;
            background-color: #0f172a;
            min-height: 100vh;
            color: white;
        }

        /* ===== VIDEO BACKGROUND ===== */
        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.05);
        }

        /* ===== OVERLAYS ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .overlay-black {
            background: rgba(0, 0, 0, 0.3);
        }

        .overlay-gradient-horizontal {
            background: linear-gradient(to right, rgba(2, 6, 23, 0.9), rgba(15, 23, 42, 0.5), transparent);
        }

        .overlay-gradient-vertical {
            background: linear-gradient(to top, rgba(2, 6, 23, 0.8), transparent, transparent);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            position: relative;
            z-index: 10;
            max-width: 1536px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .main-content {
                padding: 0 3rem;
            }
        }

        @media (min-width: 1024px) {
            .main-content {
                padding: 0 6rem;
            }
        }

        /* ===== NAVIGATION ===== */
        nav {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            padding: 2rem 0;
            opacity: 0;
            animation: fadeInDown 1s ease-out 0.3s forwards;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .nav-links {
                gap: 4rem;
            }
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.025em;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-links a.hidden-mobile {
            display: none;
        }

        @media (min-width: 640px) {
            .nav-links a.hidden-mobile {
                display: inline;
            }
        }

        .logo-container {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            border: 1px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            cursor: pointer;
            margin: 0 0.5rem;
        }

        .logo-container:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .logo-container i {
            color: white;
            font-size: 1.5rem;
        }

        @media (min-width: 768px) {
            .logo-container {
                margin: 0 1.5rem;
            }
        }

        /* ===== HERO CONTENT ===== */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-bottom: 6rem;
            padding-top: 2.5rem;
        }

        .hero-content {
            max-width: 42rem;
        }

        /* Staggered Animation Container */
        .stagger-container > * {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-container > *:nth-child(1) { animation-delay: 0.3s; }
        .stagger-container > *:nth-child(2) { animation-delay: 0.45s; }
        .stagger-container > *:nth-child(3) { animation-delay: 0.6s; }
        .stagger-container > *:nth-child(4) { animation-delay: 0.75s; }
        .stagger-container > *:nth-child(5) { animation-delay: 0.9s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Eyebrow */
        .eyebrow {
            color: #e2b05c;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.025em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            .eyebrow {
                font-size: 1rem;
            }
        }

        /* Headline */
        .headline {
            font-family: "Playfair Display", serif;
            font-size: 1.875rem;
            font-weight: 400;
            line-height: 1.1;
            color: white;
            margin-bottom: 2rem;
        }

        @media (min-width: 768px) {
            .headline {
                font-size: 2.25rem;
            }
        }

        @media (min-width: 1024px) {
            .headline {
                font-size: 3rem;
            }
        }

        .headline br {
            display: block;
        }

        /* Decorative Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .divider i {
            color: #e2b05c;
            font-size: 1.25rem;
        }

        .divider-line {
            height: 1px;
            width: 8rem;
            background: rgba(226, 176, 92, 0.3);
        }

        /* Subheadline */
        .subheadline {
            font-size: 1.125rem;
            font-weight: 300;
            line-height: 1.625;
            color: rgba(255, 255, 255, 0.8);
            max-width: 32rem;
            margin-bottom: 2.5rem;
        }

        @media (min-width: 768px) {
            .subheadline {
                font-size: 1.25rem;
            }
        }

        /* ===== BUTTONS ===== */
        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .cta-group {
                flex-direction: row;
            }
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background-color: #3ba4ab;
            color: white;
            padding: 1rem 2rem;
            border-radius: 9999px;
            border: none;
            font-family: "Inter", sans-serif;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .btn-primary:hover {
            background-color: #47c4c9;
        }

        .btn-primary i {
            transition: transform 0.2s;
        }

        .btn-primary:hover i {
            transform: translateX(4px);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background-color: transparent;
            color: white;
            padding: 1rem 2rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-family: "Inter", sans-serif;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-secondary:hover {
            border-color: white;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .btn-secondary i {
            opacity: 0.7;
            transition: all 0.2s;
        }

        .btn-secondary:hover i {
            opacity: 1;
            transform: translateX(4px);
        }

        /* ===== RESPONSIVE FIXES ===== */
        @media (max-width: 639px) {
            .nav-links a.hidden-mobile {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== VIDEO BACKGROUND ===== -->
    <div class="video-wrapper">
        <video autoplay loop muted playsinline>
            <source src="https://strvid.nyc3.cdn.digitaloceanspaces.com/motionsite/hero_video_mindfull.mp4" type="video/mp4" />
        </video>
    </div>

    <!-- ===== OVERLAYS ===== -->
    <div class="overlay overlay-black"></div>
    <div class="overlay overlay-gradient-horizontal"></div>
    <div class="overlay overlay-gradient-vertical"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">

        <!-- ===== NAVIGATION ===== -->
        <nav>
            <div class="nav-links">
                <a href="#" class="hidden-mobile">Home</a>
                <a href="#" class="hidden-mobile">Practices</a>
            </div>

            <div class="logo-container">
                <i class="fas fa-seedling"></i>
            </div>

            <div class="nav-links">
                <a href="#" class="hidden-mobile">Journal</a>
                <a href="#" class="hidden-mobile">Community</a>
            </div>
        </nav>

        <!-- ===== HERO CONTENT ===== -->
        <div class="hero">
            <div class="hero-content stagger-container">

                <!-- Eyebrow -->
                <div class="eyebrow">Small Steps. Lasting Change.</div>

                <!-- Headline -->
                <h1 class="headline">
                    Calm Your Mind,<br />
                    Transform Your Life.
                </h1>

                <!-- Divider -->
                <div class="divider">
                    <i class="fas fa-leaf"></i>
                    <div class="divider-line"></div>
                </div>

                <!-- Subheadline -->
                <p class="subheadline">
                    Daily practices to reduce stress, build mindfulness, and create a
                    life of balance and purpose.
                </p>

                <!-- CTA Buttons -->
                <div class="cta-group">
                    <a href="#" class="btn-primary">
                        Start Your Journey
                        <i class="fas fa-arrow-right"></i>
                    </a>
                    <a href="#" class="btn-secondary">
                        Learn More
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>

            </div>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // Optional: Add any JavaScript functionality here
        console.log('Mindful Hero Banner loaded!');

        // If video fails to load, show fallback
        const video = document.querySelector('video');
        if (video) {
            video.addEventListener('error', function() {
                console.log('Video failed to load. Using fallback background.');
            });
        }
    </script>

</body>
</html>
